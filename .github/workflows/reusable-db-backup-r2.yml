# Reusable nightly Postgres backup (Supabase) to Cloudflare R2.
# Produces a compressed, encrypted pg_dump and uploads it to
# s3://<bucket>/<prefix>/YYYY/MM/DD/<timestamp>.dump.gpg
# Set an R2 lifecycle rule on the bucket to expire old backups (e.g. 30 days).
name: reusable-db-backup-r2

on:
  workflow_call:
    inputs:
      environment:
        type: string
        default: "production"
      prefix:
        description: "Object key prefix, usually the app name"
        type: string
        required: true
      pg-major:
        type: string
        default: "17"
    secrets:
      DATABASE_URL:
        description: "Direct (non-pooled) Postgres connection string"
        required: true
      BACKUP_PASSPHRASE:
        description: "Symmetric passphrase used to encrypt the dump (store it in a password manager too)"
        required: true
      R2_ACCOUNT_ID:
        required: true
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_BUCKET:
        required: true

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: ${{ inputs.environment }}
    steps:
      - name: Install pg_dump ${{ inputs.pg-major }}
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -sSfo /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq "postgresql-client-${{ inputs.pg-major }}"

      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          set -euo pipefail
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          "/usr/lib/postgresql/${{ inputs.pg-major }}/bin/pg_dump" --format=custom --no-owner --no-privileges "$DATABASE_URL" \
            | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase-fd 3 -o backup.dump.gpg 3<<<"$BACKUP_PASSPHRASE"
          echo "KEY=${{ inputs.prefix }}/$(date -u +%Y/%m/%d)/${TS}.dump.gpg" >> "$GITHUB_ENV"
          ls -lh backup.dump.gpg

      - name: Upload to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws s3 cp backup.dump.gpg "s3://${{ secrets.R2_BUCKET }}/${KEY}" \
            --endpoint-url "https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com" --only-show-errors
          echo "Uploaded ${KEY}"
