# Reusable Supabase migrations.
# - mode: check  -> starts nothing remote; lints migrations and shows a dry-run diff
# - mode: apply  -> pushes pending migrations to the linked project (use a protected Environment)
# Migrations are forward-only. Never put destructive SQL (DROP/TRUNCATE) in a migration
# without a reviewed backup first.
name: reusable-supabase-migrations

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      mode:
        description: "check | apply"
        type: string
        default: "check"
      working-directory:
        type: string
        default: "."
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
      SUPABASE_DB_PASSWORD:
        required: true
      SUPABASE_PROJECT_REF:
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v7
      - uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Guard against destructive SQL
        run: |
          if [ ! -d supabase/migrations ]; then echo "No supabase/migrations folder; nothing to do."; exit 0; fi
          if grep -RInE '\b(DROP[[:space:]]+(TABLE|SCHEMA|DATABASE)|TRUNCATE)\b' supabase/migrations \
             | grep -v -- '-- allow-destructive'; then
            echo "::error::Destructive SQL found. Add '-- allow-destructive' on that line after a reviewed backup."
            exit 1
          fi

      - name: Link project
        run: supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_REF }}" --password "$SUPABASE_DB_PASSWORD"

      - name: Dry run
        run: supabase db push --dry-run --password "$SUPABASE_DB_PASSWORD"

      - name: Apply
        if: inputs.mode == 'apply'
        run: supabase db push --password "$SUPABASE_DB_PASSWORD"
