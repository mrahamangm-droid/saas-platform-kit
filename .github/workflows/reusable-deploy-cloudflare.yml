# Reusable deploy to Cloudflare Workers (or Pages via `command`).
# Uses a GitHub Environment so production deploys can require approval.
name: reusable-deploy-cloudflare

on:
  workflow_call:
    inputs:
      environment:
        description: "GitHub Environment name (staging | production)"
        type: string
        required: true
      command:
        description: "Wrangler command, e.g. 'deploy --env production' or 'pages deploy ./out --project-name=my-app'"
        type: string
        default: "deploy"
      working-directory:
        type: string
        default: "."
      node-version:
        type: string
        default: "22"
      build-command:
        description: "Optional build command run before wrangler (e.g. 'npm run build')"
        type: string
        default: ""
    secrets:
      CLOUDFLARE_API_TOKEN:
        required: true
      CLOUDFLARE_ACCOUNT_ID:
        required: true

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-cloudflare-${{ inputs.environment }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: ${{ inputs.environment }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ inputs.node-version }}
      - name: Install
        run: |
          if [ -f pnpm-lock.yaml ]; then corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then corepack enable && yarn install --frozen-lockfile
          elif [ -f package-lock.json ]; then npm ci
          fi
      - name: Build
        if: inputs.build-command != ''
        run: ${{ inputs.build-command }}
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ inputs.working-directory }}
          command: ${{ inputs.command }}
