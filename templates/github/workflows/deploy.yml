# Copy to <your-app>/.github/workflows/deploy.yml
# main -> staging automatically, then production after approval
# (add required reviewers to the "production" Environment).
#
# Vercel apps: Vercel's Git integration already deploys previews and production,
# so keep only the migrate-* jobs and delete the cloudflare-* jobs.
name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

jobs:
  migrate-staging:
    uses: mrahamangm-droid/saas-platform-kit/.github/workflows/reusable-supabase-migrations.yml@v1
    with: { environment: staging, mode: apply }
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  cloudflare-staging:
    needs: migrate-staging
    uses: mrahamangm-droid/saas-platform-kit/.github/workflows/reusable-deploy-cloudflare.yml@v1
    with:
      environment: staging
      command: deploy --env staging
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  migrate-production:
    needs: cloudflare-staging
    uses: mrahamangm-droid/saas-platform-kit/.github/workflows/reusable-supabase-migrations.yml@v1
    with: { environment: production, mode: apply }
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}

  cloudflare-production:
    needs: migrate-production
    uses: mrahamangm-droid/saas-platform-kit/.github/workflows/reusable-deploy-cloudflare.yml@v1
    with:
      environment: production
      command: deploy --env production
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
